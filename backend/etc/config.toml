frontend_url = "http://localhost:5173"

[web]
port = 3000
listen_addr = "0.0.0.0"
max_concurrent_requests = 1000
request_timeout_secs = 300
base_url = "http://localhost:3000"

[database]
url = "postgres://root:123456@127.0.0.1:5432/filedb"
max_connections = 50
min_connections = 5
acquire_timeout_secs = 3
idle_timeout_secs = 600
max_lifetime_secs = 1800

[storage]
kind = "local"
local_path = "uploads"

encryption_key = ""
s3_bucket = "clovalink-bucket"

[redis]
url = "redis://:123456@127.0.0.1:6001"

[extensions]
webhook_timeout_ms = 5000

[cdn]
use_presigned_urls = false
presigned_url_expiry_secs = 3600
domain = ""

[transfer]
small_concurrent = 50
medium_concurrent = 20
large_concurrent = 5
large_bandwidth_mbps = 50

[replication]
enabled = false
endpoint = ""
bucket = ""
region = "us-east-1"
access_key = ""
secret_key = ""
mode = "backup"
retry_seconds = 60
workers = 4
max_retries = 5

[virus_scan]
enabled = false
host = "localhost"
port = 3310
timeout_ms = 30000
workers = 4
max_file_size_mb = 100
max_queue_size = 10000

[backup]
master_key = ""
max_concurrent = 2

[api_usage]
enabled = true
sample_rate = 1.0

[auth]
jwt_secret = "INSECURE_DEV_SECRET_DO_NOT_USE_IN_PRODUCTION_12345"
jwt_secret_secondary = ""
jwt_issuer = "clovalink"
jwt_audience = "clovalink-api"
jwt_expiry_secs = 604800

[discord]
client_id = ""
client_secret = ""
redirect_uri = ""

[wecom]
# 企业微信扫码登录配置
# https://wx.aam.com/api/auth/wecom/callback
enabled = true
corp_id = "wwbc61c69bd65fc69b"                                 # 企业微信 CorpId，如 ww1234567890abcdef
agent_id = "1000015"                                           # 自建固件 AgentId，如 1000002
corp_secret = "uRywD4tMDiKOZCOgFJ6yb2jZDd7D743M-pgapQ0fmPQ"    # 自建固件 Secret
redirect_uri = "http://localhost:8081/api/auth/wecom/callback"

[gitlab]
# GitLab API 客户端与 CI/CD 配置
enabled = true
url = "https://gitlab.com" # GitLab 实例地址（公网或私有化部署地址，如 http://gitlab.example.com）
token = ""                 # Personal Access Token 或 Project Access Token（需要 api / read_api 权限）
default_project_id = ""    # 默认项目 ID 或路径（例如 12345 或 "group/project"）
timeout_secs = 30          # 请求超时时间（秒）

[rate_limit]
trust_all_proxies = false
trusted_proxy_ips = []
per_ip_requests_per_sec = 100
per_ip_burst_size = 200

[cors]
environment = "development"
dev_mode = true
allowed_origins = [
    "http://localhost:3000",
    "http://localhost:5173",
    "http://localhost:8080",
]


[log]
# 日志级别(1:error,2:warn,3:info,4:debug,5:Trace)
level = 4
# 大小切割(单位M)
size_mb = 5
# 保留天数
# keep_day = 3
# 打印风格 Default,Line,Module,Full
style = "Line"
# 日志目录
dir = "./logs"
# 是否打印到控制台
console = true
# 过滤的模块
filters = [
    "h2",
    "ureq",
    "rumqttc",
    "network",
    "tracing",
    "rustls",
    "hyper",
    "reqwest",
    "downloader-http-rs",
]
