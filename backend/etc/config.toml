# 重置密码，企业微信服务跳转地址
frontend_url = "http://localhost:5173"

# web 服务配置
[web]
port = 3000
listen_addr = "0.0.0.0"
max_concurrent_requests = 1000
request_timeout_secs = 300
base_url = "http://localhost:3000"
allowed_origins = [
    "http://localhost:3000",
    "http://localhost:5173",
    "http://localhost:8080",
]


# 数据配置
[database]
url = "postgres://root:123456@127.0.0.1:5432/filedb"
max_connections = 50
min_connections = 5
acquire_timeout_secs = 3
idle_timeout_secs = 600
max_lifetime_secs = 1800

# 存储配置
[storage]
# local s3
kind = "s3"
local_path = "uploads"
encryption_key = ""

# s3 配置
s3_bucket = "fileyard"
s3_endpoint = "http://127.0.0.1:9000"
s3_access_key = "fileyard"
s3_access_secret = "eQwqw8mk8xo87ExyoR5b3HUUB1C5RLBEWgbZWfPL"


# 当用户在主存储上传（或删除）文件时，
# 系统会在后台通过任务队列异步将文件同步到一个从属的 S3 兼容存储桶
#（如 AWS S3、MinIO、Cloudflare R2、Ceph 等），
# 实现跨云/跨地域的数据容灾与冷备
[replication]
enabled = true
endpoint = "http://127.0.0.1:9000"
bucket = "fileyard-backup"
region = "us-east-1"
access_key = "fileyard"
secret_key = "eQwqw8mk8xo87ExyoR5b3HUUB1C5RLBEWgbZWfPL"
mode = "backup"
retry_seconds = 60
workers = 4
max_retries = 5


#缓存配置
[redis]
url = "redis://:123456@127.0.0.1:6001"

# 扩展
[extensions]
webhook_timeout_ms = 5000

# 传输配置
[transfer]
small_concurrent = 50
medium_concurrent = 20
large_concurrent = 5
large_bandwidth_mbps = 50

#  文件杀毒配置
[virus_scan]
enabled = false
host = "localhost"
port = 3310
timeout_ms = 30000
workers = 4
max_file_size_mb = 100
max_queue_size = 10000

# 定时备份配置
[backup]
master_key = ""
max_concurrent = 2

# AI 审计配置
[api_usage]
enabled = true
sample_rate = 1.0

# 授权配置
[auth]
jwt_secret = "a2988jsdjasdfadf22222222222"
jwt_secret_secondary = ""
jwt_issuer = "fileyard"
jwt_audience = "fileyard-api"
jwt_expiry_secs = 604800


# 企业微信扫码登录配置
[wecom]
# https://wx.aam.com/api/auth/wecom/callback
enabled = true
corp_id = "wwbc61c69bd65fc69b"                                 # 企业微信 CorpId，如 ww1234567890abcdef
agent_id = "1000015"                                           # 自建固件 AgentId，如 1000002
corp_secret = "uRywD4tMDiKOZCOgFJ6yb2jZDd7D743M-pgapQ0fmPQ"    # 自建固件 Secret
redirect_uri = "http://localhost:8081/api/auth/wecom/callback"


# GitLab API 客户端与 CI/CD 配置
[gitlab]
enabled = true
url = "http://172.16.25.96:800" # GitLab 实例地址（公网或私有化部署地址，如 http://gitlab.example.com）
token = ""
default_project_id = "1"    # 默认项目 ID 或路径（例如 12345 或 "group/project"）
timeout_secs = 30          # 请求超时时间（秒）

# 限流配置
[rate_limit]
trust_all_proxies = false
trusted_proxy_ips = []
per_ip_requests_per_sec = 100
per_ip_burst_size = 200

# 日志配置
[log]
# 日志级别(1:error,2:warn,3:info,4:debug,5:Trace)
level = 4
# 大小切割(单位M)
size_mb = 5
# 保留天数
# keep_day = 3
# 打印风格 Default,Line,Module,Full
style = "Line"
# 日志目录
dir = "./logs"
# 是否打印到控制台
console = true
# 过滤的模块（提高到 Warn 级别，屏蔽 Debug/Info 刷屏）
filters = [
    "h2",
    "ureq",
    "rumqttc",
    "network",
    "tracing",
    "rustls",
    "hyper",
    "reqwest",
    "downloader-http-rs",
    "sled",
    "kv-storage",
    "kv_storage",
    "rmqtt",
    "rmqtt_net",
    "rmqtt_conf",
    "mqttd",
    "app::auth::middleware",
    "app::middleware::api_usage",
]

# MQTT 服务器
[mqtt]
# 是否随主程序启动 MQTT 服务器
enabled = true
# MQTT 核心配置文件路径（相对于运行根目录或绝对路径）
config_path = "etc/mqttd.toml"
# MQTT 插件配置文件所在目录
plugins_dir = "etc/plugins"
