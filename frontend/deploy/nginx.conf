user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # Gzip 压缩配置，加快资源加载
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Host 网络模式下直接访问宿主机上的后端服务
    upstream backend_service {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    server {
        listen       8005;
        server_name  _;

        root /usr/share/nginx/html;
        index index.html;

        # Fileyard 作为网盘/文件管理系统，必须放开文件上传大小限制
        client_max_body_size 0;

        # 安全防护响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 运行时动态环境配置：禁止任何浏览器或代理缓存
        location = /config.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires -1;
        }

        # index.html 禁止强缓存，确保前端发版后用户能第一时间加载最新版本
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires -1;
        }

        # Vite 编译带 Hash 的静态资源（位于 /assets/）：开启永久长效缓存
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # 后端 API 反向代理配置
        location /api/ {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;

            # 支持 WebSocket 协议升级
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 上传大文件时关闭缓冲，启用流式转发，避免磁盘缓冲耗尽
            proxy_request_buffering off;
            proxy_buffering off;

            # 延长超时时间以支持大文件传输与长时间任务
            proxy_connect_timeout 300s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # 前端单页面应用 (SPA) 路由支持：找不到物理文件时回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 错误页面处理
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
